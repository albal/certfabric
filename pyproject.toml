[project]
name = "certfabric"
version = "0.1.0"
description = "Agentless certificate lifecycle management for LAN and homelab devices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "cryptography>=43",
    "asyncssh>=2.24.1",
    "httpx>=0.28.1",
]

[project.scripts]
certfabric = "certfabric.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["certfabric"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
