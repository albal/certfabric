[project]
name = "certfabric"
version = "0.1.0"
readme = "README.md"
description = "Agentless certificate lifecycle management for LAN and homelab devices"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "cryptography>=43",
    "asyncssh>=2.24.1",
    "httpx>=0.28.1",
]

[project.scripts]
certfabric = "certfabric.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "playwright>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["certfabric"]
# The built dashboard (copied to certfabric/static by the Dockerfile and install script) is not in git.
artifacts = ["certfabric/static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
