name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor in pyproject.toml; 3.12 is what the Docker image ships.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The UI tests drive the built dashboard; `build` also type-checks it.
      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # setup-uv publishes no floating major tags, so pin the release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # ubuntu-latest ships Google Chrome, which the UI tests launch via Playwright's `chrome` channel.
      - name: Run tests
        run: uv run pytest -ra
